name: Sync dbt docs

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  DOCS_REMOTE: https://github.com/dbt-labs/docs.getdbt.com.git
  DOCS_CLONE_DIR: ${{ github.workspace }}/docs.getdbt.com
  # Cache keys are immutable, so prepare saves under a per-run key and restores
  # the most recent one via the shared prefix.
  GIT_CACHE_KEY: docs-getdbt-git-${{ github.run_id }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      upstream_sha: ${{ steps.update.outputs.upstream_sha }}
      changes: ${{ steps.update.outputs.changes }}
    steps:
      - name: Restore docs.getdbt.com git cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache only .git -- the working tree is rebuilt from it via reset --hard,
          # which keeps the cache small (no build artifacts or checked-out files).
          path: ${{ env.DOCS_CLONE_DIR }}/.git
          key: ${{ env.GIT_CACHE_KEY }}
          restore-keys: docs-getdbt-git-

      - name: Clone or update docs.getdbt.com and record commit range
        id: update
        run: |
          if [[ -d "$DOCS_CLONE_DIR/.git" ]]; then
            # Cache hit: only .git was restored. Its HEAD is the last sync baseline.
            cd "$DOCS_CLONE_DIR"
            last_synced_sha=$(git rev-parse HEAD)
            git fetch --quiet origin
            # reset --hard rebuilds the working tree from the cached .git, then advances to upstream.
            git reset --hard --quiet '@{u}'
            git clean -fdq
          else
            # Cold cache / first run: full clone, no baseline to diff against.
            git clone --quiet "$DOCS_REMOTE" "$DOCS_CLONE_DIR"
            cd "$DOCS_CLONE_DIR"
            last_synced_sha=""
          fi
          upstream_sha=$(git rev-parse HEAD)
          echo "Last synced upstream SHA: ${last_synced_sha:-<none>}"
          echo "Current upstream SHA:     $upstream_sha"
          # Pin the SHA so every build shard resets to the same commit even if
          # upstream moves while the matrix is running.
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          # Commit message body. Each line: short SHA + subject.
          changes=$(
            echo "Upstream docs.getdbt.com changes since last sync:"
            echo
            if [[ -z "$last_synced_sha" ]]; then
              echo "(no recorded baseline -- listing latest 20 upstream commits)"
              git log --no-merges --max-count=20 --pretty=format:'- %h %s' "$upstream_sha"
            elif [[ "$last_synced_sha" == "$upstream_sha" ]]; then
              echo "(no new upstream commits -- rebuild only)"
            else
              git log --no-merges --pretty=format:'- %h %s' "${last_synced_sha}..${upstream_sha}"
            fi
          )
          echo "Commit body preview:"
          echo "$changes"
          {
            echo "changes<<CHANGES_EOF"
            echo "$changes"
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Save docs.getdbt.com git cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCS_CLONE_DIR }}/.git
          key: ${{ env.GIT_CACHE_KEY }}

      - name: Derive build matrix
        id: matrix
        working-directory: ${{ env.DOCS_CLONE_DIR }}/website
        run: |
          # Derive (version, product name, subProduct) from dbt-versions.js.
          # For each product, picks the first non-beta subProduct per version (falling
          # back to the first beta if no non-beta exists for that product+version).
          # This mirrors resolveSubProductFromProductAndVersion() in VersionContext.js.
          #
          # The blog doesn't vary by version, so it gets one extra shard of its own,
          # rendered as the first product. It's kept apart from the version shards
          # because the llms-txt plugin's include options apply to llms.txt too, and
          # turning the blog on there would add it to that version's llms files.
          matrix=$(node - <<'JSEOF'
          const { products } = require('./dbt-versions');
          const out = [];
          for (const product of products) {
            for (const version of new Set(product.subProducts.map(sp => sp.version))) {
              const forVersion = product.subProducts.filter(sp => sp.version === version);
              const chosen = forVersion.find(sp => !sp.isBeta) || forVersion[0];
              out.push({
                name: product.name.toLowerCase(),
                version: version.replace(/\./g, '_'),
                subproduct: chosen.name,
              });
            }
          }
          out.push({ name: 'blog', version: 'all', subproduct: out[0].subproduct });
          process.stdout.write(JSON.stringify(out));
          JSEOF
          )
          echo "Build matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # One shard per (product, version), plus the blog. Each rebuilds the working
  # tree from the shared .git cache at the pinned SHA, then runs a single
  # Docusaurus build.
  build:
    name: Build ${{ matrix.build.name }} ${{ matrix.build.version }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Restore docs.getdbt.com git cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCS_CLONE_DIR }}/.git
          # Exact hit on the cache prepare just saved for this run.
          key: ${{ env.GIT_CACHE_KEY }}
          restore-keys: docs-getdbt-git-

      - name: Rebuild working tree at pinned SHA
        working-directory: ${{ env.DOCS_CLONE_DIR }}
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          # Normally an exact cache hit already has the pinned commit. On a
          # re-run, prepare can't overwrite this run's key, so the restored
          # .git may predate the pinned SHA. Fetch it before resetting.
          if ! git reset --hard --quiet "$UPSTREAM_SHA" 2>/dev/null; then
            git fetch --quiet origin
            git reset --hard --quiet "$UPSTREAM_SHA"
          fi
          git clean -fdq

      - name: Cache docs.getdbt.com node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCS_CLONE_DIR }}/website/node_modules
          key: docs-node-modules-${{ hashFiles('docs.getdbt.com/website/package-lock.json') }}

      - name: Install npm dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.DOCS_CLONE_DIR }}/website
        run: npm install

      - name: Patch Docusaurus
        working-directory: ${{ env.DOCS_CLONE_DIR }}
        run: |
          # --allow-empty: the compare diff is legitimately empty whenever the
          # branch has nothing on top of upstream current (everything merged).
          curl -fsSL \
            "https://github.com/joshuataylor/docs.getdbt.com/compare/dbt-labs:current...feature/fix-markdown.diff" \
            | git apply --3way --allow-empty

      - name: Build docs
        working-directory: ${{ env.DOCS_CLONE_DIR }}/website
        env:
          SKIP_LINK_CHECK: "true"
          DOCS_ENV: build
          NAME: ${{ matrix.build.name }}
          VERSION: ${{ matrix.build.version }}
          SUBPRODUCT: ${{ matrix.build.subproduct }}
          BUILD_BLOG: ${{ matrix.build.name == 'blog' }}
          MD_STAGE: ${{ runner.temp }}/md
        run: |
          # Set the default subProduct so SSR renders version- and product-appropriate
          # content for this pass, and turn on blog markdown for the blog shard.
          # Fail loudly if upstream changes either line, rather than silently
          # building the wrong content.
          python3 - <<'PYEOF'
          import os
          import sys

          def replace_once(path, old, new):
              with open(path) as f:
                  content = f.read()
              if content.count(old) != 1:
                  sys.exit(f'Expected exactly one {old!r} in {path}')
              with open(path, 'w') as f:
                  f.write(content.replace(old, new))

          subproduct = os.environ['SUBPRODUCT']
          replace_once(
              'src/stores/VersionContext.js',
              'const defaultSubProductName = getDefaultSubProductName();',
              f'const defaultSubProductName = "{subproduct}";',
          )
          print('Patched VersionContext for', subproduct)

          if os.environ['BUILD_BLOG'] == 'true':
              replace_once('docusaurus.config.js', 'includeBlog: false,', 'includeBlog: true,')
              print('Enabled blog markdown')
          PYEOF

          npm exec -- docusaurus clear
          npm run build -- --no-minify

          if [[ "$BUILD_BLOG" == "true" ]]; then
            # Posts only: the list, pagination, tag, author and archive pages are chrome.
            src=build/blog/
            dest="$MD_STAGE/blog"
            filters=(--exclude='/page/' --exclude='/tags/' --exclude='/authors/'
              --exclude='/tags.md' --exclude='/authors.md' --exclude='/archive*')
          else
            # img/ only holds static assets, one of which happens to be a .md file.
            src=build/
            dest="$MD_STAGE/$NAME/$VERSION"
            filters=(--exclude='/img/' --include='/llms.txt' --include='/llms-full.txt')
          fi
          mkdir -p "$dest"
          rsync -a -m "${filters[@]}" --include='*/' --include='*.md' --exclude='*' "$src" "$dest/"
          md_count=$(find "$dest" -type f -name '*.md' | wc -l)
          echo "Copied $md_count markdown files to ${dest#"$MD_STAGE"/}"

          # The commit job rebuilds docs/ from scratch, so a shard that copies
          # nothing would delete its output from the repo. Fail instead.
          if (( md_count == 0 )); then
            echo "ERROR: build produced no markdown"
            exit 1
          fi
          if [[ "$BUILD_BLOG" != "true" && ! -s "$dest/llms.txt" ]]; then
            echo "ERROR: build did not produce llms.txt"
            exit 1
          fi

      - name: Prefix blog posts with their date
        if: matrix.build.name == 'blog'
        working-directory: ${{ env.DOCS_CLONE_DIR }}/website
        env:
          BLOG_DIR: ${{ runner.temp }}/md/blog
        run: |
          # Rename each post to YYYY-MM-DD-<slug>.md so they sort chronologically,
          # and point post-to-post links at the new names. The date comes from the
          # metadata Docusaurus writes per post, which has already resolved front
          # matter vs filename dates (they differ for some posts).
          python3 - <<'PYEOF'
          import glob
          import json
          import os
          import re
          import sys

          blog_dir = os.path.normpath(os.environ['BLOG_DIR'])

          dates = {}
          for path in glob.glob('.docusaurus/docusaurus-plugin-content-blog/*/*.json'):
              with open(path) as f:
                  meta = json.load(f)
              if isinstance(meta, dict) and 'date' in meta and 'permalink' in meta:
                  dates[meta['permalink'].strip('/').removeprefix('blog/')] = meta['date'][:10]

          posts = sorted(glob.glob(f'{blog_dir}/**/*.md', recursive=True))
          renames = {}
          for path in posts:
              slug = os.path.relpath(path, blog_dir).removesuffix('.md')
              if slug not in dates:
                  print(f'::warning::No date for blog/{slug}.md, leaving its name as is')
                  continue
              head, name = os.path.split(path)
              renames[path] = os.path.join(head, f'{dates[slug]}-{name}')
          if not renames:
              sys.exit('No blog post dates found in .docusaurus')

          link = re.compile(r'\]\(([^)\s#]+\.md)(?=[)#\s])')
          for path in posts:
              here = os.path.dirname(path)
              new_here = os.path.dirname(renames.get(path, path))

              def relink(m):
                  target = m[1]
                  if '://' in target or target.startswith('/'):
                      return m[0]
                  resolved = os.path.normpath(os.path.join(here, target))
                  if resolved not in renames:
                      return m[0]
                  new = os.path.relpath(renames[resolved], new_here)
                  if target.startswith('./') and not new.startswith('.'):
                      new = './' + new
                  return f']({new}'

              with open(path) as f:
                  content = f.read()
              relinked = link.sub(relink, content)
              if relinked != content:
                  with open(path, 'w') as f:
                      f.write(relinked)

          for old, new in renames.items():
              os.rename(old, new)
          print(f'Dated {len(renames)} of {len(posts)} blog posts')
          PYEOF

      - name: Upload markdown
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: md-${{ matrix.build.name }}-${{ matrix.build.version }}
          path: ${{ runner.temp }}/md
          retention-days: 1
          if-no-files-found: error

  # Merge every shard's markdown into docs/ and push a single commit.
  commit:
    name: Commit and push
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # Rebuild docs/ from scratch so removed upstream pages are dropped
      # (git add -A below stages the deletions).
      - name: Reset docs directory
        run: rm -rf docs

      - name: Download markdown shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: md-*
          merge-multiple: true
          path: docs

      - name: Commit and push to main
        env:
          UPSTREAM_CHANGES: ${{ needs.prepare.outputs.changes }}
        run: |
          touch docs/.gitkeep
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            timestamp=$(date -u +'%Y_%m_%d__%H_%M_%S')
            printf 'Regenerate dbt documentation as of %s\n\n%s\n' "$timestamp" "$UPSTREAM_CHANGES" \
              | git commit -F -
            git push origin main
          fi
